name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [linux-appimage]
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'cpmfile.json'
      - 'dist/**'
      - 'tools/linux/**'
      - '.github/workflows/linux-appimage.yml'

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld g++ cmake ninja-build curl git patch pkg-config autoconf automake \
            libtool nasm qt6-base-private-dev qt6-charts-dev qt6-tools-dev \
            qt6-wayland-dev qt6-wayland libavfilter-dev libavcodec-dev libswscale-dev \
            libva-dev libvdpau-dev libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev glslang-tools \
            spirv-tools spirv-headers zlib1g-dev libssl-dev liblz4-dev libzstd-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 python3-venv xz-utils xvfb xauth patchelf file
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Cache pinned source dependencies
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: linux-appimage-cpm-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeModules/CPMUtil.cmake') }}
      - name: Build, test and package
        env:
          BUILD_JOBS: '2'
        run: bash tools/linux/build-appimage.sh
      - name: Check packaged GUI startup
        run: |
          xvfb-run -a python3 tools/linux/smoke-appimage.py \
            build/appimage-output/Fritchii-v*-Linux-x86_64.AppImage \
            build/appimage-output/gui-startup.log
      - name: Upload AppImage and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Fritchii-Linux-x86_64
          path: build/appimage-output/*
          if-no-files-found: error
          retention-days: 14
